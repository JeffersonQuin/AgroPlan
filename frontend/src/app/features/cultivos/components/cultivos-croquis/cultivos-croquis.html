<div class="bg-white rounded-xl border border-agro-border shadow-sm h-full flex flex-col overflow-hidden">
  <div class="flex items-center justify-between px-3 py-2 border-b border-slate-100 bg-slate-50/60">
    <span class="text-[11px] font-bold uppercase tracking-wider text-slate-500">
      Tu terreno
    </span>
    <span class="text-[10px] font-semibold text-slate-400">
      La distribución se calcula en el resumen final
    </span>
  </div>

  <div class="relative flex-1 min-h-[420px]">
    <svg class="w-full h-full" viewBox="0 0 740 480" role="img" aria-label="Terreno del paso 1">
      <defs>
        <linearGradient id="terrenoGradient" x1="0%" x2="100%" y1="0%" y2="100%">
          <stop offset="0%" stop-color="#F1F5F9"></stop>
          <stop offset="100%" stop-color="#E2E8F0"></stop>
        </linearGradient>
      </defs>
      <rect x="0" y="0" width="740" height="480" fill="#ffffff"></rect>

      @if (terreno() !== '') {
        <polygon
          [attr.points]="terreno()"
          fill="url(#terrenoGradient)"
          stroke="#2E7D32"
          stroke-width="3"
          stroke-linejoin="round"
        ></polygon>
        <text x="370" y="230" text-anchor="middle" fill="#475569" font-size="12" font-weight="700">
          Terreno del paso 1
        </text>
        <text x="370" y="250" text-anchor="middle" fill="#94a3b8" font-size="11">
          El agente reparte esta área entre tus productos en el resumen
        </text>
      } @else {
        <text x="370" y="240" text-anchor="middle" fill="#94a3b8" font-size="13">
          Todavía no hay terreno definido
        </text>
      }
    </svg>
  </div>
</div>
