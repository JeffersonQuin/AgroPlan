<div class="bg-white rounded-xl border border-agro-border shadow-sm h-full flex flex-col overflow-hidden">
  <div class="flex items-center justify-between px-3 py-2 border-b border-slate-100 bg-slate-50/60">
    <span class="text-[11px] font-bold uppercase tracking-wider text-slate-500">
      Distribución de cultivos
    </span>
    <span class="text-[10px] font-semibold text-slate-400">
      Geometría calculada por el motor
    </span>
  </div>

  <div class="relative flex-1 min-h-[420px]">
    <svg class="w-full h-full" viewBox="0 0 740 480" role="img" aria-label="Distribución de cultivos">
      <rect x="0" y="0" width="740" height="480" fill="#ffffff"></rect>

      @if (bloques().length === 0) {
        <text x="370" y="240" text-anchor="middle" fill="#94a3b8" font-size="13">
          Agregá un cultivo para ver la distribución
        </text>
      }

      @for (bloque of bloques(); track bloque.id) {
        <polygon
          [attr.points]="bloque.puntos"
          [attr.fill]="bloque.color"
          fill-opacity="0.35"
          [attr.stroke]="bloque.color"
          stroke-width="2.5"
          stroke-linejoin="round"
        ></polygon>
        <text
          [attr.x]="centro(bloque).x"
          [attr.y]="centro(bloque).y"
          text-anchor="middle"
          fill="#0f172a"
          font-size="12"
          font-weight="700"
        >
          {{ bloque.etiqueta }} · {{ bloque.porcentaje }}%
        </text>
      }
    </svg>
  </div>

  <div class="bg-white border-t border-agro-border px-4 py-2.5 flex flex-wrap items-center gap-4 text-[11px]">
    <span class="font-bold text-slate-700">Leyenda:</span>
    @for (bloque of bloques(); track bloque.id) {
      <div class="flex items-center gap-1.5">
        <div class="w-4 h-3 rounded-xs" [style.background]="bloque.color"></div>
        <span class="text-slate-600 font-medium">{{ bloque.etiqueta }}</span>
      </div>
    }
  </div>
</div>
