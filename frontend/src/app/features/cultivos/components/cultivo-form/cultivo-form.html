<aside class="flex flex-col gap-4 overflow-y-auto max-h-[calc(100vh-9rem)] pr-1">
  <div class="bg-white rounded-xl border border-agro-border p-4 shadow-sm">
    <div class="flex items-center gap-2 pb-3 mb-3 border-b border-slate-100">
      <span class="material-symbols-outlined text-[20px] text-agro-600" aria-hidden="true"
        >potted_plant</span
      >
      <div>
        <h2 class="text-sm font-bold text-slate-800">Productos a sembrar</h2>
        <p class="text-[11px] text-slate-400">Paso 2: qué querés producir</p>
      </div>
    </div>

    <!-- Del catálogo -->
    <label class="block text-xs font-semibold text-slate-700 mb-1.5" for="especie">
      Producto del catálogo
    </label>
    <div class="flex gap-1.5 mb-3">
      <select
        class="flex-1 text-xs font-medium rounded-lg border-slate-300 focus:border-agro-500 focus:ring-1 focus:ring-agro-500 py-2 bg-white"
        id="especie"
        [disabled]="opciones().length === 0"
        [ngModel]="codigo() ?? opciones()[0]?.value ?? ''"
        (ngModelChange)="codigo.set($event)"
      >
        @for (opcion of opciones(); track opcion.value) {
          <option [value]="opcion.value">{{ opcion.label }}</option>
        }
        @if (opciones().length === 0) {
          <option value="">Ya agregaste todos</option>
        }
      </select>
      <button
        class="shrink-0 px-2.5 py-2 rounded-lg bg-agro-500 hover:bg-agro-600 disabled:opacity-50 text-white text-xs font-bold"
        type="button"
        aria-label="Agregar producto del catálogo"
        [title]="motivoSinCatalogo() ?? 'Agregar este producto a la lista'"
        [disabled]="!puedeAgregarCatalogo()"
        (click)="agregarDelCatalogo()"
      >
        <span class="material-symbols-outlined text-[16px] align-middle" aria-hidden="true"
          >add</span
        >
      </button>
    </div>

    <!-- Producto nuevo -->
    <label class="block text-xs font-semibold text-slate-700 mb-1.5" for="nuevo-producto">
      ¿Otro producto? Escribilo
    </label>
    <div class="flex gap-1.5">
      <input
        class="flex-1 text-xs rounded-lg border-slate-300 py-2 focus:border-agro-500 focus:ring-1 focus:ring-agro-500"
        id="nuevo-producto"
        placeholder="Ej: yuca, chia, mani"
        type="text"
        [ngModel]="nuevo()"
        (ngModelChange)="onNuevo($event)"
        (keydown.enter)="agregarNuevo()"
      />
      <button
        class="shrink-0 px-3 py-2 rounded-lg border border-agro-300 text-agro-700 text-xs font-bold hover:bg-agro-50"
        type="button"
        (click)="agregarNuevo()"
      >
        Agregar
      </button>
    </div>
    @if (aviso(); as mensaje) {
      <p class="text-[10px] text-error font-semibold mt-1.5" role="alert">{{ mensaje }}</p>
    } @else {
      <p class="text-[10px] text-slate-400 mt-1.5">
        Escribí 2 letras o más y tocá Agregar. El agente lo investiga al generar el resumen.
      </p>
    }

    <!-- Siembra -->
    <div class="mt-3 pt-3 border-t border-slate-100">
      <label class="block text-xs font-semibold text-slate-700 mb-1.5" for="siembra">
        Fecha de siembra
      </label>
      <input
        class="w-full text-xs rounded-lg border-slate-300 py-2"
        id="siembra"
        type="date"
        [value]="borrador.siembra()"
        (input)="borrador.setSiembra($any($event.target).value)"
      />
      <p class="text-[10px] text-slate-400 mt-1">
        Por defecto hoy. La cosecha la estima el agente en el resumen final.
      </p>
    </div>
  </div>
</aside>
