<div class="bg-agro-surface text-slate-800 font-sans min-h-screen flex flex-col antialiased">
  <app-wizard-header
    [paso]="2"
    [nombreProyecto]="store.nombreProyecto()"
    [estadoGuardado]="store.estadoGuardadoLabel()"
  />

  <main
    class="flex-1 p-4 grid grid-cols-1 lg:grid-cols-[300px_1fr_320px] gap-4 max-w-[1920px] mx-auto w-full items-start overflow-hidden"
  >
    <app-cultivo-form />

    <div class="flex flex-col gap-3 min-h-[460px]">
      <!-- Cabecera del proyecto -->
      <div
        class="bg-white rounded-xl border border-agro-border px-4 py-2.5 shadow-sm flex items-center justify-between gap-3"
      >
        <div class="flex items-center gap-2 min-w-0">
          <span class="material-symbols-outlined text-[18px] text-agro-600" aria-hidden="true"
            >location_on</span
          >
          <span class="text-xs font-bold text-slate-800 truncate">
            {{ store.nombreProyecto() }} ({{ store.areaM2() }} m²)
          </span>
        </div>
        <div class="text-[11px] text-slate-500 shrink-0">
          Capacidad hidráulica de referencia:
          <strong class="text-slate-800">{{ store.caudalM3h() }} m³/h</strong>
          @if (store.sueloCodigo()) {
            · suelo <strong class="text-slate-800">{{ store.sueloCodigo() }}</strong>
          }
        </div>
      </div>

      <app-cultivos-croquis />

      <!-- Navegación del wizard -->
      <div class="flex items-center justify-between">
        <a
          class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg border border-slate-300 text-slate-700 text-xs font-semibold hover:bg-slate-50"
          [routerLink]="['/proyectos', proyectoId(), 'terreno']"
        >
          <span class="material-symbols-outlined text-[16px]" aria-hidden="true">arrow_back</span>
          Volver a Terreno
        </a>
        <button
          class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-slate-200 text-slate-500 text-xs font-semibold cursor-not-allowed"
          type="button"
          title="Paso 3 (Sistema): próximamente"
          disabled
        >
          A Sistema
          <span class="material-symbols-outlined text-[16px]" aria-hidden="true">arrow_forward</span>
        </button>
      </div>
    </div>

    <app-cultivos-panel (editar)="onEditar($event)" />
  </main>
</div>
