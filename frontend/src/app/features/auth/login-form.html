<div class="flex flex-col gap-space-md">
  <div class="flex flex-col gap-space-xs">
    <label class="text-label-md text-on-surface" for="input-email">
      Correo electrónico profesional
    </label>
    <div class="relative flex items-center">
      <span
        class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[18px]"
        aria-hidden="true"
        >alternate_email</span
      >
      <input
        id="input-email"
        type="email"
        class="w-full pl-10 pr-space-md py-2.5 rounded-lg bg-surface text-body-md text-on-surface placeholder:text-outline focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary transition-all disabled:opacity-60 disabled:cursor-not-allowed"
        placeholder="agronomo@agroplan.com"
        autocomplete="email"
        disabled
      />
    </div>
  </div>

  <app-login-password-field inputId="input-password" label="Contraseña" [disabled]="true" />

  <div class="flex items-center justify-between pt-space-xs">
    <label class="flex items-center gap-space-xs select-none opacity-60">
      <input
        type="checkbox"
        disabled
        class="w-4 h-4 rounded text-primary focus:ring-primary accent-primary cursor-not-allowed"
      />
      <span class="text-body-sm text-on-surface-variant">Recordar esta estación de trabajo</span>
    </label>
    <div class="flex items-center gap-1 text-on-surface-variant">
      <span class="material-symbols-outlined text-[14px] text-secondary" aria-hidden="true"
        >cloud_done</span
      >
      <span class="text-label-sm">Servidor CL-LATAM</span>
    </div>
  </div>

  <div class="rounded-lg bg-surface-container-low px-3 py-2 text-label-sm text-on-surface-variant">
    El backend todavía no acepta correo y contraseña. Ingresá con tu cuenta de Google.
  </div>

  @if (error()) {
    <p class="text-label-sm text-error" role="alert">{{ error() }}</p>
  }

  <div class="pt-space-xs">
    <!-- The button stays mounted: unmounting it re-runs google.accounts.id.initialize() -->
    <div [class]="isSubmitting() ? 'pointer-events-none opacity-50' : ''">
      <app-google-sign-in (credential)="onCredential($event)" />
    </div>

    @if (isSubmitting()) {
      <p
        class="mt-2 flex items-center justify-center gap-space-xs text-label-md text-on-surface-variant"
        role="status"
      >
        <span class="material-symbols-outlined text-[18px] animate-spin" aria-hidden="true"
          >progress_activity</span
        >
        {{ store.submitLabel() }}
      </p>
    }
  </div>
</div>
