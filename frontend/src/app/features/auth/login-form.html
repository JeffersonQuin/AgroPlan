<form class="flex flex-col gap-space-md" (submit)="onSubmit($event)" novalidate>
  @if (isRegister()) {
    <div class="flex flex-col gap-space-xs">
      <label class="text-label-md text-on-surface" for="input-name">Nombre y Apellido</label>
      <div class="relative flex items-center">
        <span
          class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[18px]"
          aria-hidden="true"
          >person</span
        >
        <input
          id="input-name"
          type="text"
          [formField]="authForm.fullName"
          class="w-full pl-10 pr-space-md py-2.5 rounded-lg bg-surface text-body-md text-on-surface placeholder:text-outline focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary transition-all"
          placeholder="Ing. Agrónomo Juan Pérez"
          autocomplete="name"
        />
      </div>
    </div>
  }

  <div class="flex flex-col gap-space-xs">
    <label class="text-label-md text-on-surface" for="input-email"> Correo electrónico </label>
    <div class="relative flex items-center">
      <span
        class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[18px]"
        aria-hidden="true"
        >alternate_email</span
      >
      <input
        id="input-email"
        type="email"
        [formField]="authForm.email"
        [attr.aria-invalid]="emailError().length > 0"
        [attr.aria-describedby]="emailError() ? 'input-email-error' : null"
        class="w-full pl-10 pr-space-md py-2.5 rounded-lg bg-surface text-body-md text-on-surface placeholder:text-outline focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary transition-all"
        placeholder="agronomo@agroplan.com"
        autocomplete="email"
      />
    </div>
    @if (emailError()) {
      <p id="input-email-error" class="text-label-sm text-error" role="alert">
        {{ emailError() }}
      </p>
    }
  </div>

  <app-login-password-field
    inputId="input-password"
    label="Contraseña"
    [field]="authForm.password"
  />

  <div class="flex items-center justify-between pt-space-xs">
    <label class="flex items-center gap-space-xs cursor-pointer select-none">
      <input
        type="checkbox"
        [formField]="authForm.rememberStation"
        class="w-4 h-4 rounded text-primary focus:ring-primary accent-primary cursor-pointer"
      />
      <span class="text-body-sm text-on-surface-variant">Recordar esta estación de trabajo</span>
    </label>
    <div class="flex items-center gap-1 text-on-surface-variant">
      <span class="material-symbols-outlined text-[14px] text-secondary" aria-hidden="true"
        >cloud_done</span
      >
    </div>
  </div>

  <button
    class="w-full py-2.5 px-space-lg rounded-lg bg-primary hover:bg-primary-container text-on-primary text-label-md flex items-center justify-center gap-space-xs shadow-sm transition-all duration-150 active:scale-[0.99] disabled:opacity-70 disabled:cursor-not-allowed"
    type="submit"
    [disabled]="isBusy()"
  >
    <span>{{ submitLabel() }}</span>
    <span
      class="material-symbols-outlined text-[18px]"
      [class.animate-spin]="isSubmitting()"
      aria-hidden="true"
      >{{ submitIcon() }}</span
    >
  </button>

  <p class="sr-only" role="status" aria-live="polite">{{ statusAnnouncement() }}</p>

  <button
    class="w-full py-2 px-space-md rounded-lg bg-surface-container-low hover:bg-surface-container text-primary text-label-sm flex items-center justify-center gap-space-xs transition-colors"
    type="button"
    (click)="onDemoCredentials()"
  >
    <span class="material-symbols-outlined text-[18px]" aria-hidden="true">terminal</span>
    <span>Acceder con usuario de prueba (Demo Jurado)</span>
  </button>
</form>
