<form class="flex flex-col gap-space-md" (submit)="onSubmit($event)" novalidate>
  <!-- Google is the primary path: it renders first and is never gated behind the form. -->
  <div [class]="isSubmitting() ? 'pointer-events-none opacity-50' : ''">
    <app-google-sign-in (credential)="onCredential($event)" />
  </div>

  <div class="relative flex items-center justify-center">
    <div class="h-px w-full bg-surface-variant"></div>
    <span
      class="absolute bg-surface-container-lowest px-space-sm text-label-sm text-outline whitespace-nowrap"
    >
      o con tu correo
    </span>
  </div>

  <div class="flex flex-col gap-space-xs">
    <label class="text-label-md text-on-surface" for="input-email">
      Correo electrónico profesional
    </label>
    <div class="relative flex items-center">
      <ng-icon
        class="absolute left-3 text-on-surface-variant"
        name="matAlternateEmailOutline"
        size="18"
        aria-hidden="true"
      />
      <input
        id="input-email"
        type="email"
        [formField]="form.email"
        class="w-full pl-10 pr-space-md py-2.5 rounded-lg bg-surface text-body-md text-on-surface placeholder:text-outline focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary transition-all disabled:opacity-60 disabled:cursor-not-allowed"
        placeholder="agronomo@agroplan.com"
        autocomplete="email"
        [attr.aria-invalid]="emailError().length > 0"
        [attr.aria-describedby]="emailError() ? 'input-email-error' : null"
      />
    </div>
    @if (emailError()) {
      <p id="input-email-error" class="text-label-sm text-error" role="alert">{{ emailError() }}</p>
    }
  </div>

  <div class="flex flex-col gap-space-xs">
    <div class="flex flex-wrap items-center justify-between gap-x-space-sm gap-y-1">
      <label class="text-label-md text-on-surface" for="input-password">Contraseña</label>
      <a
        class="text-label-sm text-primary hover:text-secondary underline decoration-dotted transition-colors"
        href="#"
      >
        ¿Olvidaste tu contraseña?
      </a>
    </div>

    <div class="relative flex items-center">
      <ng-icon
        class="absolute left-3 text-on-surface-variant"
        name="matLockOutline"
        size="18"
        aria-hidden="true"
      />
      <input
        id="input-password"
        [type]="passwordVisible() ? 'text' : 'password'"
        [formField]="form.password"
        class="w-full pl-10 pr-11 py-2.5 rounded-lg bg-surface text-body-md text-on-surface placeholder:text-outline focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary transition-all disabled:opacity-60 disabled:cursor-not-allowed"
        placeholder="••••••••••••"
        autocomplete="current-password"
        [attr.aria-invalid]="passwordError().length > 0"
        [attr.aria-describedby]="passwordError() ? 'input-password-error' : null"
      />
      <button
        class="absolute right-3 text-on-surface-variant hover:text-on-surface p-1 rounded focus:outline-none focus-visible:ring-2 focus-visible:ring-primary transition-colors"
        type="button"
        [attr.aria-label]="passwordVisible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        [attr.aria-pressed]="passwordVisible()"
        (click)="togglePassword()"
      >
        <ng-icon
          [name]="passwordVisible() ? 'matVisibilityOffOutline' : 'matVisibilityOutline'"
          size="18"
          aria-hidden="true"
        />
      </button>
    </div>
    @if (passwordError()) {
      <p id="input-password-error" class="text-label-sm text-error" role="alert">
        {{ passwordError() }}
      </p>
    }
  </div>

  <div class="flex flex-wrap items-center justify-between gap-x-space-sm gap-y-space-xs">
    <label class="flex items-center gap-space-xs select-none cursor-pointer">
      <input
        type="checkbox"
        [formField]="form.rememberStation"
        class="w-4 h-4 rounded text-primary focus:ring-primary accent-primary cursor-pointer"
      />
      <span class="text-body-sm text-on-surface-variant">Recordar esta estación de trabajo</span>
    </label>
    <div class="flex items-center gap-1 text-on-surface-variant">
      <ng-icon class="text-secondary" name="matCloudDoneOutline" size="14" aria-hidden="true" />
      <span class="text-label-sm">Servidor CL-LATAM</span>
    </div>
  </div>

  @if (error()) {
    <p class="text-label-sm text-error" role="alert">{{ error() }}</p>
  }

  <button
    type="submit"
    class="w-full inline-flex items-center justify-center gap-space-xs rounded-lg border border-outline-variant/60 px-space-md py-2.5 text-label-md text-on-surface hover:bg-surface-container-low focus:outline-none focus-visible:ring-2 focus-visible:ring-primary transition-colors disabled:opacity-60 disabled:cursor-not-allowed"
    [disabled]="isSubmitting()"
  >
    Ingresar con correo
  </button>

  @if (isSubmitting()) {
    <p
      class="flex items-center justify-center gap-space-xs text-label-md text-on-surface-variant"
      role="status"
    >
      <ng-icon
        class="animate-spin"
        name="matProgressActivityOutline"
        size="18"
        aria-hidden="true"
      />
      {{ copy.submitting }}
    </p>
  }
</form>
