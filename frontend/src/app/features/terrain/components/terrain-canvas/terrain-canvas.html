<div class="bg-white rounded-xl border border-agro-border shadow-sm flex flex-col overflow-hidden h-full">
  <!-- Barra de herramientas del croquis -->
  <div
    class="flex items-center justify-between gap-2 px-3 py-2 border-b border-slate-100 bg-slate-50/60"
  >
    <div class="flex items-center gap-1">
      <button
        class="p-1.5 rounded text-agro-600 bg-emerald-50/60 transition-colors"
        title="Dibujo manual de vértices: próximamente"
        disabled
        aria-disabled="true"
        style="opacity: 0.45; cursor: not-allowed"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="m3 3 7.07 16.97 2.51-7.39 7.39-2.51L3 3z"></path>
          <path d="m13 13 6 6"></path>
        </svg>
      </button>
      <button
        class="p-1.5 rounded text-slate-600 transition-colors"
        title="Ajuste automático a la cuadrícula: próximamente"
        disabled
        aria-disabled="true"
        style="opacity: 0.45; cursor: not-allowed"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M3 3h18v18H3z"></path>
          <path d="M3 9h18M3 15h18M9 3v18M15 3v18"></path>
        </svg>
      </button>
      <button
        class="p-1.5 rounded text-slate-600 transition-colors"
        title="Zoom y paneo: próximamente"
        disabled
        aria-disabled="true"
        style="opacity: 0.45; cursor: not-allowed"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m21 21-4.3-4.3"></path>
        </svg>
      </button>
    </div>
    <span class="text-[10px] font-semibold text-slate-400">
      Arrastrá un vértice para ajustar las cotas
    </span>
  </div>

  <!-- Croquis -->
  <div class="relative flex-1 min-h-[420px]">
    <svg
      #lienzo
      class="w-full h-full touch-none"
      viewBox="0 0 740 480"
      role="img"
      aria-label="Croquis del terreno"
      (pointermove)="onPointerMove($event)"
      (pointerup)="onPointerUp()"
      (pointercancel)="onPointerUp()"
      (pointerleave)="onPointerUp()"
    >
      <defs>
        <linearGradient id="terrenoGradient" x1="0%" x2="100%" y1="0%" y2="100%">
          <stop offset="0%" stop-color="#E8F8E8"></stop>
          <stop offset="100%" stop-color="#D5F0D5"></stop>
        </linearGradient>
      </defs>

      <!-- Camino de servicio: el mismo contorno, con trazo ancho -->
      <polygon
        fill="none"
        opacity="0.35"
        [attr.points]="dibujo().puntos"
        stroke="#94a3b8"
        stroke-linejoin="round"
        stroke-width="12"
      ></polygon>
      <polygon
        fill="none"
        [attr.points]="dibujo().puntos"
        stroke="#64748b"
        stroke-dasharray="4,4"
        stroke-linejoin="round"
        stroke-width="1.5"
      ></polygon>

      <!-- Terreno real: el mismo polígono que se guarda en el backend -->
      <polygon
        fill="url(#terrenoGradient)"
        [attr.points]="dibujo().puntos"
        stroke="#2E7D32"
        stroke-linejoin="round"
        stroke-width="3.5"
      ></polygon>

      <!-- Cotas: una etiqueta por lado, con su longitud en metros -->
      @for (lado of dibujo().lados; track $index) {
        <g class="font-sans">
          <rect
            [attr.x]="lado.cajaX"
            [attr.y]="lado.cajaY"
            fill="#ffffff"
            height="24"
            rx="4"
            stroke="#cbd5e1"
            stroke-width="1"
            width="84"
          ></rect>
          <text
            [attr.x]="lado.textoX"
            [attr.y]="lado.textoY"
            fill="#0f172a"
            font-size="12"
            font-weight="700"
            text-anchor="middle"
          >
            {{ lado.etiqueta }}
          </text>
        </g>
      }

      <!-- Barrera viva: sigue los bordes superior e inferior de la figura -->
      @for (arbol of dibujo().arboles; track $index) {
        <circle
          [attr.cx]="arbol.x"
          [attr.cy]="arbol.y"
          [attr.r]="arbol.radio"
          [attr.fill]="arbol.claro ? '#388E3C' : '#2E7D32'"
          stroke="#1E5222"
          stroke-width="2"
        ></circle>
      }

      <!-- Vértices arrastrables: mover uno reescribe las cotas -->
      @for (vertice of dibujo().vertices; track $index) {
        <g
          class="group cursor-grab active:cursor-grabbing"
          (pointerdown)="onPointerDown($index, $event)"
        >
          <circle
            [attr.cx]="vertice.x"
            [attr.cy]="vertice.y"
            r="16"
            fill="transparent"
            class="touch-none"
          ></circle>
          <circle
            [attr.cx]="vertice.x"
            [attr.cy]="vertice.y"
            r="11"
            fill="#22c55e"
            opacity="0.3"
            class="opacity-0 group-hover:opacity-100 transition-opacity"
          ></circle>
          <circle
            [attr.cx]="vertice.x"
            [attr.cy]="vertice.y"
            r="7"
            fill="#ffffff"
            stroke="#16a34a"
            stroke-width="3"
          ></circle>
        </g>
      }
    </svg>

    <!-- Escala gráfica -->
    <div
      class="absolute bottom-3 left-4 bg-white/90 backdrop-blur-xs px-3 py-1.5 rounded-lg border border-slate-200"
    >
      <div class="flex items-center text-[10px] font-bold text-slate-600 gap-5">
        <span>0</span><span>10</span><span>20</span><span>30</span><span>40</span><span>50</span>
        <span>60 m</span>
      </div>
      <div class="w-44 h-1.5 bg-slate-300 rounded-full flex overflow-hidden mt-0.5 border border-slate-400">
        <div class="w-1/6 bg-slate-800"></div>
        <div class="w-1/6 bg-white"></div>
        <div class="w-1/6 bg-slate-800"></div>
        <div class="w-1/6 bg-white"></div>
        <div class="w-1/6 bg-slate-800"></div>
        <div class="w-1/6 bg-white"></div>
      </div>
    </div>
  </div>

  <!-- Leyenda: solo lo que el croquis hace de verdad -->
  <div
    class="bg-white border-t border-agro-border px-4 py-2.5 flex flex-wrap items-center gap-4 text-[11px]"
  >
    <span class="font-bold text-slate-700">Leyenda:</span>
    <div class="flex items-center gap-1.5">
      <div class="w-4 h-3 bg-emerald-100 border-2 border-agro-500 rounded-xs"></div>
      <span class="text-slate-600 font-medium">Límite del terreno</span>
    </div>
    <div class="flex items-center gap-1.5">
      <div class="w-5 h-[2px] bg-slate-800"></div>
      <span class="text-slate-600 font-medium">Línea de cota</span>
    </div>
    <div class="flex items-center gap-1.5">
      <div class="w-3.5 h-3.5 rounded-full bg-white border-[3px] border-agro-600"></div>
      <span class="text-slate-600 font-medium">Vértice arrastrable</span>
    </div>
    <div class="flex items-center gap-1.5">
      <div class="w-3.5 h-3.5 rounded-full bg-agro-700 border-2 border-emerald-900"></div>
      <span class="text-slate-600 font-medium">Barrera viva / árboles</span>
    </div>
  </div>
</div>
