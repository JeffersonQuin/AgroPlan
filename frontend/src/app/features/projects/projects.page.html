<app-header (newProject)="openModal()" />

<main class="w-full pt-16 bg-surface min-h-[calc(100vh-64px)]">
  <div class="flex flex-col w-full">
    <div
      class="w-full max-w-7xl mx-auto px-margin-desktop py-space-lg flex flex-col gap-space-lg"
    >
      <app-projects-toolbar
        [activeCount]="store.projects().length"
        [emptyStateSimulated]="emptySimulated()"
        (newProject)="openModal()"
        (toggleEmptyState)="toggleEmptyState()"
      />

      <app-projects-filters />

      @if (showOnboarding()) {
        <app-projects-empty-state (createFirst)="openModal()" />
      } @else {
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-space-lg">
          @for (project of store.visibleProjects(); track project.id) {
            <app-project-card [project]="project" />
          }

          <button
            class="group text-left bg-surface-bright/50 hover:bg-surface-bright rounded-xl p-space-lg transition-all flex flex-col items-center justify-center min-h-[380px] text-center cursor-pointer shadow-xs hover:shadow-sm"
            type="button"
            (click)="openModal()"
          >
            <span
              class="w-14 h-14 rounded-full bg-surface-container-low flex items-center justify-center text-primary mb-space-sm group-hover:bg-primary-container group-hover:text-on-primary transition-colors"
            >
              <span class="material-symbols-outlined text-[28px]" aria-hidden="true">add</span>
            </span>
            <span class="text-headline-sm text-on-surface">Creá tu nuevo plano</span>
            <span
              class="inline-flex items-center gap-1 text-label-md text-primary mt-space-sm group-hover:gap-2 transition-all"
            >
              Comenzar diseño
              <span class="material-symbols-outlined text-[16px]" aria-hidden="true"
                >arrow_forward</span
              >
            </span>
          </button>
        </div>

        @if (showNoResults()) {
          <div
            class="bg-surface-container-lowest rounded-xl p-space-xl text-center shadow-sm"
            role="status"
          >
            <p class="text-headline-sm text-on-surface">Sin resultados</p>
            <p class="text-body-md text-on-surface-variant mt-1">
              Ningún proyecto coincide con la búsqueda o el filtro aplicado.
            </p>
          </div>
        }
      }

      <app-technical-footnote />
    </div>
  </div>
</main>

@if (modalOpen()) {
  <app-project-create-modal (close)="closeModal()" />
}
