<section
  class="bg-white rounded-xl border border-agro-border p-4 shadow-sm flex flex-col gap-3"
  data-seccion-calendario
>
  <h2 class="text-sm font-bold text-slate-800">Calendario Agronómico</h2>

  @if (calendario().length === 0) {
    <p class="text-[11px] text-slate-500">
      Calendario agronómico: <span class="text-slate-400">no informado</span>.
    </p>
  } @else {
    <div class="bg-slate-50/70 border border-slate-100 rounded-lg overflow-hidden">
      <table class="w-full text-left text-[10.5px]">
        <thead>
          <tr class="bg-slate-100/70 border-b border-slate-200 text-slate-600 font-bold">
            <th class="py-1.5 px-2.5">Cultivo</th>
            <th class="py-1.5 px-2 text-center">Siembra</th>
            <th class="py-1.5 px-2 text-center">Cosecha</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-200/50">
          @for (bloque of calendario(); track $index) {
            <tr data-calendario-fila>
              <td class="py-1.5 px-2.5 font-bold text-slate-800">{{ nombre(bloque) }}</td>
              <td class="py-1.5 px-2 text-center font-mono font-medium text-slate-700">
                {{ formatearFecha(bloque.siembra) }}
              </td>
              <td class="py-1.5 px-2 text-center font-mono font-bold text-agro-800">
                {{ formatearFecha(bloque.cosecha) }}
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</section>
